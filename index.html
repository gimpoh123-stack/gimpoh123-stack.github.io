<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>김포 일식 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="hero-copy">
        <p class="eyebrow">Gimpo Japanese food recommender</p>
        <h1>오늘 김포에서 어떤 일식을 먹을까요?</h1>
        <p class="lead">김포시 일반음식점 일식 현황을 바탕으로 지역, 가격대, 식사 상황, 메뉴 취향에 가까운 후보를 추천합니다.</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <span class="plate">Pick</span>
        <span class="bubble one">지역</span>
        <span class="bubble two">취향</span>
        <span class="bubble three">상황</span>
      </div>
    </header>

    <main class="layout">
      <section class="panel controls" aria-label="추천 조건">
        <div class="field">
          <label for="category">음식 종류</label>
          <select id="category"><option value="">전체</option></select>
        </div>
        <div class="field">
          <label for="area">지역</label>
          <select id="area"><option value="">전체</option></select>
        </div>
        <div class="field">
          <label for="priceLevel">가격대</label>
          <select id="priceLevel"><option value="">전체</option></select>
        </div>
        <fieldset class="chips" id="situationOptions"><legend>식사 상황</legend></fieldset>
        <fieldset class="chips" id="tasteOptions"><legend>메뉴 취향</legend></fieldset>
        <div class="field">
          <label for="keyword">검색어</label>
          <input id="keyword" type="search" placeholder="예: 스시, 라멘, 장기동">
        </div>
        <div class="actions">
          <button class="primary" id="recommendButton" type="button">조건 추천</button>
          <button id="randomButton" type="button">랜덤 추천</button>
          <button id="resetButton" type="button">초기화</button>
        </div>
      </section>

      <section class="panel results" aria-live="polite">
        <div class="result-head">
          <div>
            <p class="eyebrow">Recommendation</p>
            <h2 id="resultTitle">추천 결과</h2>
          </div>
          <p id="resultMeta">조건을 선택하거나 랜덤 추천을 눌러보세요.</p>
        </div>
        <div id="notice" class="notice" hidden></div>
        <div id="cards" class="cards"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>공공데이터 기반 MVP입니다. 메뉴, 가격, 영업 여부는 방문 전 지도와 검색 링크에서 다시 확인하세요.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
